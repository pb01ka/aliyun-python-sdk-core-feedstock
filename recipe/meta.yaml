{% set name = "aliyun-python-sdk-core" %}
{% set version = "2.16.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 651caad597eb39d4fad6cf85133dffe92837d53bdf62db9d8f37dab6508bb8f9

build:
  number: 2

requirements:
  host:
    - python
    - pip
    - setuptools
    - ca-certificates
  run:
    - python
    - jmespath >=0.9.3,<1.0.0
    - cryptography >=2.9.2
    - ca-certificates

test:
  imports:
    - aliyunsdkcore
  commands:
    # Make sure the vendored cacert.pem was actually replaced by the one
    # ca-certificates provides, rather than silently left in place.
    - cmp "$SP_DIR/aliyunsdkcore/vendored/requests/packages/certifi/cacert.pem" "$PREFIX/ssl/cacert.pem"  # [unix]
    - fc "%SP_DIR%\aliyunsdkcore\vendored\requests\packages\certifi\cacert.pem" "%LIBRARY_PREFIX%\ssl\cacert.pem"  # [win]

about:
  home: https://github.com/aliyun/aliyun-openapi-python-sdk
  license: Apache-2.0
  license_file: LICENSE
  summary: The core module of Aliyun Python SDK.

  description: |
    The Alibaba Cloud Python Software Development Kit (SDK) allows you to
    access Alibaba Cloud services such as Elastic Compute Service (ECS),
    Object Storage Service (OSS), and Resource Access Management (RAM).
    You can access Alibaba Cloud services without the need to handle API
    related tasks, such as signing and constructing your requests.

extra:
  recipe-maintainers:
    - shcheklein
    - maxhora
