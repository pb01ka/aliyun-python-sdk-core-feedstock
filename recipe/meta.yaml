{% set name = "aliyun-python-sdk-core" %}
{% set version = "2.16.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 651caad597eb39d4fad6cf85133dffe92837d53bdf62db9d8f37dab6508bb8f9

build:
  number: 3
  script:
    # aliyunsdkcore vendors an old copy of requests whose bundled certifi
    # returns a hardcoded path to its own frozen CA bundle (frozen since
    # 2018-01-18, long since stale).
    # Make the vendored requests import the real certifi instead
    # Also drop the now-dead vendored copy so it never ships.
    - {{ PYTHON }} -c "p = 'aliyunsdkcore/vendored/requests/certs.py'; s = open(p).read(); open(p, 'w').write(s.replace('from .packages.certifi import where', 'from certifi import where'))"
    - {{ PYTHON }} -c "import shutil; shutil.rmtree('aliyunsdkcore/vendored/requests/packages/certifi')"
    - {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - jmespath >=0.9.3,<1.0.0
    - cryptography >=2.9.2
    - certifi

test:
  imports:
    - aliyunsdkcore
  commands:
    # The vendored certifi copy (and its stale cacert.pem) must be gone...
    - python -c "import os, aliyunsdkcore; assert not os.path.exists(os.path.join(os.path.dirname(aliyunsdkcore.__file__), 'vendored', 'requests', 'packages', 'certifi'))"
    # ...and the vendored requests module must resolve certs through the real certifi.
    - python -c "import certifi, aliyunsdkcore.vendored.requests.certs as c; assert c.where() == certifi.where()"

about:
  home: https://github.com/aliyun/aliyun-openapi-python-sdk
  license: Apache-2.0
  license_file: LICENSE
  summary: The core module of Aliyun Python SDK.

  description: |
    The Alibaba Cloud Python Software Development Kit (SDK) allows you to
    access Alibaba Cloud services such as Elastic Compute Service (ECS),
    Object Storage Service (OSS), and Resource Access Management (RAM).
    You can access Alibaba Cloud services without the need to handle API
    related tasks, such as signing and constructing your requests.

extra:
  recipe-maintainers:
    - shcheklein
    - maxhora
    - pb01ka
